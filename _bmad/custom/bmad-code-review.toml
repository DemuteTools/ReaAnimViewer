# Team override for the bmad-code-review skill.
# Merge rules: scalars override, arrays append, arrays-of-tables key-merge.

[workflow]

# Runs as the final terminal instruction of step-04, after findings are presented
# and the story + sprint status are synced. Antho's standing rules: a review is NOT
# finished until the work is committed, AND the review must drive the story all the
# way to `done` once the AR19 gate is confirmed — Antho should NEVER have to remind
# you to close a story or update the gate/sprint docs. Do not skip any of this.
on_complete = """
Finalize the review — do NOT end the turn before BOTH the review commit AND the closure step below are handled.

PART A — Set the correct post-review status (this project uses AR19, not the generic done/in-progress binary):
1. If unresolved `patch`/`decision-needed` action items remain → `in-progress`.
2. Otherwise the story's real done-gate is Antho's in-Reaper Windows validation (AR19), which runs AFTER this review. So the story STAYS `review` — it is NOT `done` yet, and it is NOT `in-progress`. Make the story file `Status:` line and the sprint-status.yaml entry both say `review`, noting it pends Antho's in-Reaper gate (§N). NEVER write a gate Result line as PASS, and never set `done`, before Antho confirms the in-Reaper gate — that is the exact fabrication this project forbids.

PART B — Commit the review work (one commit, current branch):
3. Stage every change produced by this review: patched source files, the story file, sprint-status.yaml, and any validator-gate or other docs touched. NEVER stage dev-only build scripts (build_spike.bat, build_forcefail.bat), the `Reaper/` folder, or gitignored/local artifacts. Keep it one-commit-per-story — do not sweep in another story's uncommitted code.
4. Commit on the CURRENT branch (branch first only if HEAD is on the default branch; never push unless asked). Conventional Commit summarizing the story + outcome (N patches / M dismissed). End the body with the Co-Authored-By trailer. If nothing to commit, say so. Report the SHA + subject.

PART C — Proactively offer/perform CLOSURE (the step Antho keeps having to remind you about — own it):
5. After the review commit, explicitly ask Antho ONE question: has the in-Reaper Windows gate (§N) for this story already passed? (He often validates before/while you review, since later stories build on it.)
6. If he confirms YES: immediately close the story WITHOUT another reminder — story file `Status:` → `done`; flip the validator-gate doc's Result line for THIS story from PENDING → `**PASS** (Antho, in-Reaper Windows validation, <date>)` with a one-paragraph confirmation in the §5/§6 style; sprint-status.yaml entry → `done` + update last_updated; if this was the epic's final story and all siblings are `done`, also set the epic → `done`. Then make a SEPARATE closure commit `chore(<epic>): story <X> → done (<gate> passed)` (same staging discipline as Part B). IMPORTANT: the repo's `guard-story-closure.sh` PreToolUse hook BLOCKS any `-> done` / status→`done` commit unless the caller is the reviewer — so YOU, as the reviewer finalizing an Antho-confirmed gate, must run this closure commit with the reviewer opt-in prefix: `BMAD_REVIEWER_CLOSURE=1 git commit -m "chore(<epic>): story <X> → done (<gate> passed)"`. Only the reviewer sets that flag; a dev/other agent hitting the block must hand closure back to the reviewer, never set the flag itself. Report the SHA.
7. If he says not yet: leave the story at `review` and tell him you will close it the moment he confirms — do not make him chase it.
"""
